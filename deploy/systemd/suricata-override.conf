# Suricata systemd override — fixes the daemon crash-loop on some installs.
# The default forking unit can flap (status=1 after ~21s CPU) while the
# service still reports active and writes nothing. Drop this into
# /etc/systemd/system/suricata.service.d/override.conf and reload.
[Service]
Type=simple
ExecStart=
ExecStart=/usr/bin/suricata -c /etc/suricata/suricata.yaml -i ens18 --runmode autofp
Restart=on-failure
RestartSec=5
# ProtectSystem=full makes /var/log read-only inside the service namespace;
# allow the log dir explicitly or eve.json silently never gets written.
ReadWritePaths=/var/log/suricata
