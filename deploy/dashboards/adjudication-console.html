<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SSOP Human Console</title>
<style>
  :root { --fg:#e8e8e8; --muted:#9a9a9a; --border:#3a3a3a; --card:#1e1e1e; --accent:#4f8cff; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --bg:#141414; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif; padding:20px; }
  h1 { font-size:18px; margin-bottom:2px; }
  .sub { color:var(--muted); font-size:12px; margin-bottom:14px; }
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:14px; }
  .tab { padding:8px 16px; cursor:pointer; border:1px solid transparent; border-bottom:none; border-radius:6px 6px 0 0; color:var(--muted); font-size:13px; background:transparent; }
  .tab.active { background:var(--card); border-color:var(--border); color:var(--fg); font-weight:600; }
  .tab .cnt { background:var(--border); border-radius:8px; padding:0 6px; font-size:11px; margin-left:4px; }
  .tab.active .cnt { background:var(--accent); color:#fff; }
  .toolbar { display:flex; gap:8px; align-items:center; margin-bottom:14px; }
  .toolbar input[type=text] { flex:1; background:var(--card); border:1px solid var(--border); color:var(--fg); padding:8px 10px; border-radius:6px; }
  .toolbar input[type=checkbox] { accent-color:var(--accent); }
  button { background:var(--card); border:1px solid var(--border); color:var(--fg); padding:7px 14px; border-radius:6px; cursor:pointer; font-size:13px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .ticket, .case, .tune { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-bottom:10px; }
  .ticket .top, .case .top { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .id { font-family:monospace; color:var(--accent); font-size:12px; }
  .report-link { font-size:11px; color:var(--accent); text-decoration:none; border:1px solid var(--border); border-radius:4px; padding:1px 6px; }
  .report-link:hover { background:var(--accent); color:#fff; }
  .title { font-weight:600; flex:1; }
  .meta { color:var(--muted); font-size:12px; margin-top:4px; }
  .actions { display:flex; gap:6px; margin-top:10px; }
  .actions button.approve { border-color:var(--ok); color:var(--ok); }
  .actions button.deny { border-color:var(--bad); color:var(--bad); }
  .actions button.fp { border-color:var(--warn); color:var(--warn); }
  .empty { color:var(--muted); text-align:center; padding:40px; font-style:italic; }
  .status { font-size:12px; padding:6px 10px; border-radius:6px; margin-top:8px; display:none; }
  .status.ok { display:block; background:rgba(63,185,80,.12); color:var(--ok); }
  .status.err { display:block; background:rgba(248,81,73,.12); color:var(--bad); }
  .badge { font-size:11px; padding:2px 8px; border-radius:10px; white-space:nowrap; }
  .badge.t2 { background:rgba(210,153,34,.15); color:var(--warn); }
  .badge.sev-high { background:rgba(248,81,73,.15); color:var(--bad); }
  .badge.sev-medium { background:rgba(210,153,34,.15); color:var(--warn); }
  .badge.sev-low { background:rgba(154,154,154,.15); color:var(--muted); }
  .badge.approve { background:rgba(63,185,80,.15); color:var(--ok); }
  .badge.deny { background:rgba(248,81,73,.15); color:var(--bad); }
  .chain { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; }
  .chain span { font-size:11px; background:#262626; border:1px solid var(--border); color:var(--fg); padding:2px 8px; border-radius:10px; }
  .ev { font-size:12px; color:var(--muted); margin-top:6px; padding-left:12px; border-left:2px solid var(--border); }
  .ev .src { color:var(--accent); font-weight:600; }
  .rationale { font-size:12px; margin-top:6px; color:var(--fg); background:#262626; border-radius:6px; padding:8px; }
  .tune .trow { display:flex; justify-content:space-between; gap:10px; align-items:center; }
  .tune .rule { font-family:monospace; color:var(--accent); }
  .tune .dec { font-size:11px; padding:2px 8px; border-radius:10px; white-space:nowrap; }
  .tune .dec.auto_fp { background:rgba(210,153,34,.15); color:var(--warn); }
  .tune .dec.escalate { background:rgba(248,81,73,.15); color:var(--bad); }
  .tune .dec.operational { background:rgba(154,154,154,.15); color:var(--muted); }
  .tune .r { font-size:12px; color:var(--muted); margin-top:4px; }
  .tune .who { font-size:11px; color:var(--muted); margin-top:2px; }
  .refreshline { color:var(--muted); font-size:11px; margin-top:10px; }
</style>
</head>
<body>
<h1>SSOP Human Console</h1>
<div class="sub">What the agents decided and why — approve, deny, or tune. Decisions become durable analyst policy.</div>

<div class="tabs">
  <div class="tab active" data-tab="tickets" onclick="showTab('tickets')">Tickets <span class="cnt" id="cnt-tickets">0</span></div>
  <div class="tab" data-tab="cases" onclick="showTab('cases')">Closed Loop <span class="cnt" id="cnt-cases">0</span></div>
  <div class="tab" data-tab="tuning" onclick="showTab('tuning')">Tuned Rules <span class="cnt" id="cnt-tuning">0</span></div>
</div>

<div class="toolbar">
  <input type="text" id="filter" placeholder="Filter (title, id, agent, entity…)" oninput="applyFilter()">
  <label style="color:var(--muted);font-size:12px;white-space:nowrap"><input type="checkbox" id="auto" checked onchange="toggleAuto()"> auto</label>
  <button class="primary" onclick="refresh()">Refresh</button>
  <button class="primary" onclick="window.open('/reports?days=7&format=html','_blank')" title="All decided cases this week as one report">Reports</button>
</div>

<div id="view"></div>
<div class="status" id="status"></div>
<div class="refreshline" id="refreshline"></div>

<script>
let data = { tickets: [], cases: [], tuning: [] };
let current = "tickets";
let autoTimer = null;

async function refresh() {
  const st = document.getElementById("status");
  st.className = "status"; st.style.display = "none";
  try {
    const [tr, cr, tr2] = await Promise.all([
      fetch("/tickets").then(r => r.json()),
      fetch("/cases").then(r => r.json()),
      fetch("/tuning").then(r => r.json())
    ]);
    data.tickets = tr.tickets || [];
    data.cases = cr.cases || [];
    data.tuning = tr2.tuning || [];
    document.getElementById("cnt-tickets").textContent = data.tickets.length;
    document.getElementById("cnt-cases").textContent = data.cases.length;
    document.getElementById("cnt-tuning").textContent = data.tuning.length;
    document.getElementById("refreshline").textContent = "Last refresh " + new Date().toLocaleTimeString() + " — " +
      data.tickets.length + " open tickets · " + data.cases.length + " cases · " + data.tuning.length + " tuned rules";
    render();
  } catch (e) {
    document.getElementById("view").innerHTML = '<div class="empty">Error: ' + esc(e.message) + '</div>';
  }
}

function showTab(t) {
  current = t;
  document.querySelectorAll(".tab").forEach(el => el.classList.toggle("active", el.dataset.tab === t));
  render();
}

function toggleAuto() {
  clearInterval(autoTimer);
  if (document.getElementById("auto").checked) autoTimer = setInterval(refresh, 15000);
}

function applyFilter() { render(); }

function matches(s) {
  const f = document.getElementById("filter").value.trim().toLowerCase();
  if (!f) return true;
  return String(s).toLowerCase().includes(f);
}

function render() {
  const view = document.getElementById("view");
  if (current === "tickets") return renderTickets(view);
  if (current === "cases") return renderCases(view);
  renderTuning(view);
}

function renderTickets(view) {
  const hits = data.tickets.filter(t =>
    matches((t.title||"") + " " + (t.ticket_id||"") + " " + (t.actor||"") + " " + (t.agent||"")));
  if (!hits.length) { view.innerHTML = '<div class="empty">No open tier-2 tickets matching filter. Clean queue.</div>'; return; }
  view.innerHTML = "";
  hits.forEach(s => {
    const t = document.createElement("div");
    t.className = "ticket";
    const ts = (s["@timestamp"] || s.ts || "").slice(0,19);
    const cid = (s.detail && s.detail.case_id) || s.case_id || "";
    const caseInfo = s.case || {};
    t.innerHTML = `
      <div class="top">
        <span class="badge t2">tier-2</span>
        <span class="title">${esc(s.title || "(no title)")}</span>
        <span class="id">${esc(s.ticket_id || "")}</span>
      </div>
      <div class="meta">actor: ${esc(s.actor || "-")} · agent: ${esc(s.agent || "-")} · ts: ${esc(ts)}${cid ? " · case: <span class='id'>" + esc(cid) + "</span>" : ""}</div>
      ${(caseInfo.techniques && caseInfo.techniques.length) ? '<div class="chain">' + caseInfo.techniques.map(tt => '<span>' + esc(tt) + '</span>').join("") + '</div>' : ""}
      ${(caseInfo.enrichments && caseInfo.enrichments.length) ? '<div class="ev"><span class="src">enrichments</span>: ' + esc(caseInfo.enrichments.map(e => (e.observable || e.value || JSON.stringify(e))).join(", ").slice(0,160)) + '</div>' : ""}
      <div class="actions">
        <button class="approve" onclick="act('${esc(s.ticket_id)}','approve',this)">Approve</button>
        <button class="deny" onclick="act('${esc(s.ticket_id)}','deny',this)">Deny</button>
        <button class="fp" onclick="act('${esc(s.ticket_id)}','fp',this)">False Positive</button>
      </div>`;
    view.appendChild(t);
  });
}

function renderCases(view) {
  const hits = data.cases.filter(c =>
    matches((c.title||"") + " " + (c.case_id||"") + " " + (c.observables||[]).join(" ")));
  if (!hits.length) { view.innerHTML = '<div class="empty">No cases matching filter.</div>'; return; }
  view.innerHTML = "";
  hits.forEach(c => {
    const inv = c.investigation || {};
    const adj = c.adjudication || {};
    const sev = inv.severity_label || "?";
    const resp = c.responder || {};
    const chain = inv.kill_chain || [];
    const evs = inv.evidence || [];
    const el = document.createElement("div");
    el.className = "case";
    el.innerHTML = `
      <div class="top">
        <span class="badge sev-${sev}">${esc(sev)}</span>
        <span class="title">${esc(c.title || c.case_id)}</span>
        <span class="id">${esc(c.case_id || "")}</span>
        <a class="report-link" target="_blank" href="/report?case_id=${encodeURIComponent(c.case_id || "")}&format=html">report</a>
        <a class="report-link" target="_blank" href="/advisory?case_id=${encodeURIComponent(c.case_id || "")}&format=html">advisory</a>
      </div>
      <div class="meta">status: ${esc(c.status || "-")} · score: ${esc(inv.severity ?? "-")} · evidence: ${esc(evs.length ?? 0)} sources${adj.decision ? ' · decision: <span class="badge ' + (adj.decision === "approve" ? "approve" : "deny") + '">' + esc(adj.decision) + "</span>" : ""}${resp.blocked !== undefined ? ' · respond blocked: ' + esc(resp.blocked) : ""}</div>
      ${chain.length ? '<div class="chain">' + chain.map(st => '<span>' + esc(st) + '</span>').join("") + '</div>' : ""}
      ${inv.hypothesis ? '<div class="rationale">' + esc(inv.hypothesis) + '</div>' : ""}
      ${adj.rationale ? '<div class="ev"><span class="src">supervisor</span>: ' + esc(adj.rationale) + '</div>' : ""}
      ${evs.length ? '<div class="ev"><span class="src">evidence</span>: ' + evs.map(e => esc((e.label || e.source || "?") + "×" + (e.count ?? "?"))).join(" · ") + '</div>' : ""}`;
    view.appendChild(el);
  });
}

function renderTuning(view) {
  const hits = data.tuning.filter(t => matches((t.rule_id||"") + " " + (t.decision||"") + " " + (t.rationale||"")));
  if (!hits.length) { view.innerHTML = '<div class="empty">No tuned rules.</div>'; return; }
  view.innerHTML = "";
  hits.forEach(t => {
    const el = document.createElement("div");
    el.className = "tune";
    el.innerHTML = `
      <div class="trow">
        <span class="rule">${esc(t.rule_id || "?")}</span>
        <span class="dec ${esc(t.decision || "")}">${esc(t.decision || "?")}</span>
      </div>
      ${t.rationale ? '<div class="r">' + esc(t.rationale) + '</div>' : ""}
      <div class="who">source: ${esc(t.source || "-")} · by: ${esc(t.tuned_by || "system")} · ${esc((t.ts || "").slice(0,19))}</div>`;
    view.appendChild(el);
  });
}

async function act(id, decision, btn) {
  const st = document.getElementById("status");
  st.className = "status"; st.style.display = "none";
  btn.disabled = true;
  try {
    const rationale = prompt("Rationale for " + decision + " on " + id + ":", "operator decision");
    if (rationale === null) { btn.disabled = false; return; }
    const resp = await fetch("/adjudicate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ticket_id: id, decision, rationale })
    });
    const d = await resp.json();
    if (!resp.ok || !d.ok) throw new Error(d.error || "HTTP " + resp.status);
    st.className = "status ok"; st.textContent = "✅ " + id + " → " + decision + " (tuning written)";
    setTimeout(refresh, 800);
  } catch (e) {
    st.className = "status err"; st.textContent = "❌ " + e.message;
    btn.disabled = false;
  }
}

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

refresh();
if (document.getElementById("auto").checked) autoTimer = setInterval(refresh, 15000);
</script>
</body>
</html>
