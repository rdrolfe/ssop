# SSOP deployable stack — Qdrant + Wazuh single-node
#
# Brings up the two persistent services the role agents need:
#   - Qdrant: case spine + memory (working store)
#   - Wazuh:  SIEM telemetry (alerts the analyst/hunt roles consume)
#
# All credentials come from deploy/.env (see deploy/.env.example).
# The compose file itself contains NO secrets.
#
# Usage:
#   cp deploy/.env.example deploy/.env   # edit values
#   docker compose -f deploy/docker-compose.yml up -d
#   bash deploy/bootstrap.sh

services:
  qdrant:
    image: qdrant/qdrant:v1.13.7
    container_name: ssop-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.14.5
    container_name: ssop-wazuh-indexer
    restart: unless-stopped
    env_file: .env
    ports:
      - "9200:9200"
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer

  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.5
    container_name: ssop-wazuh-manager
    restart: unless-stopped
    env_file: .env
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    volumes:
      - wazuh-manager-etc:/var/ossec/etc
      - wazuh-manager-queue:/var/ossec/queue
      - wazuh-manager-logs:/var/ossec/logs

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.14.5
    container_name: ssop-wazuh-dashboard
    restart: unless-stopped
    depends_on:
      - wazuh-indexer
      - wazuh-manager
    env_file: .env
    ports:
      - "443:443"
    volumes:
      - wazuh-dashboard-data:/usr/share/opensearch-dashboards/data

volumes:
  qdrant-data:
  wazuh-indexer-data:
  wazuh-manager-etc:
  wazuh-manager-queue:
  wazuh-manager-logs:
  wazuh-dashboard-data:
