name: BOTS HTTP exfiltration to upload endpoint
category: defense-evasion
hypothesis: "The APT exfiltrates stolen data via repeated POSTs to an upload endpoint (/UploadData.aspx). Ground truth: the infected workstation 192.168.250.100 uploads via HTTP."
analyze: bots_attack
query:
  size: 50
  query:
    bool:
      filter:
        - term:
            c_ip: "192.168.250.100"
        - match_phrase:
            uri: "UploadData.aspx"
  _source:
    - c_ip
    - uri
    - http_method
    - http_user_agent
