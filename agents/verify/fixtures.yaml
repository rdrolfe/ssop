# SSOP verification fixtures — synthetic alerts with ground-truth expectations.
# Each fixture is a Wazuh-style alert payload + what the ROLE must decide.
# Adding a fixture = adding a file or entry here; no code change.
# verdict: escalate | note | dedupe  (what the analyst/router MUST produce)
# probes marked probe: true are adversarial (designed to catch false behavior)

fixtures:
  - id: rootcheck-fp
    description: "Recurring rootcheck generic-signature flag — known false positive"
    probe: false
    alert:
      rule: {id: 510, level: 7, groups: [rootcheck, integrity], description: "Host-based anomaly detected (generic)"}
      agent: {id: "001", name: infra-ops}
      timestamp: "2026-08-19T12:00:00.000Z"
    expect:
      verdict: note
      category: integrity
      no_case: true
      # router dispatches to analyst (correct); analyst must NOT escalate
      router_role: analyst

  - id: auth-failure-burst
    description: "Burst of sshd auth failures from one source (credential stuffing)"
    probe: false
    alert:
      rule: {id: 5710, level: 5, groups: [authentication_failed, authentication], description: "sshd: authentication failure"}
      agent: {id: "004", name: network}
      timestamp: "2026-08-19T12:00:01.000Z"
    expect:
      verdict: note
      category: authentication
      no_case: true
      router_role: analyst

  - id: high-severity-suricata-c2
    description: "Suricata C2 beacon (rule 86610) — tuned auto_fp BUT carries strong TP evidence (lvl 12, ET MALWARE) — MUST escalate with tuning_override"
    probe: false
    alert:
      rule: {id: 86610, level: 12, groups: [ids, suricata, attack], description: "Suricata: Alert - ET MALWARE C2 Beacon"}
      agent: {id: "004", name: network}
      timestamp: "2026-08-19T12:00:02.000Z"
    expect:
      verdict: escalate
      category: threat
      tuning_override: true
      tuned: true

  # --- stateful decision-logic fixtures (tuning ledger + entity chains) ---

  - id: tuned-rule-no-escalate
    description: "Tuned auto_fp rule with WEAK evidence (lvl 3, operational, no threat tokens) — tuning respected, MUST NOT escalate"
    probe: false
    alert:
      rule: {id: 987654, level: 3, groups: [ids, suricata], description: "Suricata: Alert - SURICATA STREAM 3way handshake wrong seq wrong ack"}
      agent: {id: "004", name: network}
      timestamp: "2026-08-23T12:00:00.000Z"
    expect:
      verdict: note
      category: operational
      no_case: true
      tuned: true

  - id: repeated-entity-attaches
    description: "Same srcip:dstip pair as an open case — analyst must ATTACH, not mint a new case"
    probe: false
    alert:
      rule: {id: 86602, level: 12, groups: [ids, suricata, attack], description: "Suricata: Alert - ET MALWARE Repeated Entity"}
      agent: {id: "004", name: network}
      timestamp: "2026-08-23T12:00:01.000Z"
      srcip: "203.0.113.50"
      dstip: "198.51.100.7"
    expect:
      verdict: note        # analyst: escalation suppressed — attaching, not re-escalating
      category: threat
      attach: true         # analyst: verdict() must return existing_chain for the pair
      no_new_case: true    # no new case minted
      router_role: analyst # router driver: dispatch to analyst is the correct outcome

  - id: repeated-host-attaches
    description: "Same agent+rule as an open case, no entity pair — analyst must ATTACH (host recidivism), not mint a new case"
    probe: false
    alert:
      # Verify-dedicated rule id (990003): MUST stay out of exercise rotation —
      # the lab exercises fire/deny 9001/9003/2045417/9910xx and a supervisory
      # deny auto-tunes (auto_fp), which silences the fixture (classify ->
      # operational, no dispatch). Classifies threat/analyst via the ontology
      # (sysmon+malware groups, ET MALWARE desc) exactly like the old 9003.
      rule: {id: 990003, level: 12, groups: [sysmon, malware, process_creation], description: "ET MALWARE Cerber ransomware process-exec"}
      agent: {id: "007", name: we8105desk.waynecorpinc.local}
      timestamp: "2026-08-23T12:00:02.000Z"
    expect:
      verdict: note        # analyst: escalation suppressed — attaching to host chain
      category: threat
      attach: true         # analyst: verdict() must return existing_chain for the host+rule
      no_new_case: true    # no new case minted
      router_role: analyst

  - id: novel-untuned-escalates
    description: "Genuinely new alert, unseen pair, untuned class — MUST mint a case (the novel gate)"
    probe: false
    alert:
      rule: {id: 86603, level: 12, groups: [ids, suricata, attack], description: "Suricata: Alert - ET MALWARE Novel Entity"}
      agent: {id: "004", name: network}
      timestamp: "2026-08-23T12:00:02.000Z"
      srcip: "203.0.113.99"
      dstip: "198.51.100.9"
    expect:
      verdict: escalate
      category: threat
      case: true
      reconcile: true   # the real write path must keep Qdrant == JSONL

  - id: pam-session-open
    description: "PAM session open — pure noise, must NOT wake a role"
    probe: false
    alert:
      rule: {id: 5501, level: 3, groups: [authentication_success, authentication], description: "PAM: Login session opened"}
      agent: {id: "001", name: infra-ops}
      timestamp: "2026-08-19T12:00:03.000Z"
    expect:
      verdict: note
      category: operational
      no_case: true
      no_dispatch: true

  - id: apparmor-burst-repeat
    description: "AppArmor denial repeat within burst window — must dedupe"
    probe: false
    alert:
      rule: {id: 52002, level: 5, groups: [apparmor, ossec], description: "Apparmor DENIED"}
      agent: {id: "003", name: vault-secrets}
      timestamp: "2026-08-19T12:00:04.000Z"
    expect:
      verdict: note
      category: pattern
      dedupe_if_repeat: true
      # Router dedupes the repeat (burst repeat -> burst_deduped, no dispatch).
      # Hunt may legitimately flag a denial burst as suspicious — its job.
      hunt_may_escalate: true

  - id: missing-fields-adversarial
    description: "Alert missing rule/agent fields — must not crash, must not escalate"
    probe: true
    alert:
      timestamp: "2026-08-19T12:00:05.000Z"
    expect:
      verdict: note
      category: operational
      no_case: true

  - id: level-4-medium-auth
    description: "Medium-level auth event — 5715 is NOISE (sshd auth success baseline, 6.3k/30d) — no dispatch"
    probe: true
    alert:
      rule: {id: 5715, level: 4, groups: [authentication_success, authentication], description: "sshd: authentication success (unusual)"}
      agent: {id: "002", name: kb-vec}
      timestamp: "2026-08-19T12:00:06.000Z"
    expect:
      verdict: note
      no_dispatch: true
      category: authentication
      no_case: true

  # --- layer-2 drill gate (2026-09-10): synthetic-corpus replay families ---
  # The atomic/e2e/tech families are settled FPs (170+ supervisory denies in
  # the spine). is_drill_replay() must note them — no case, no dispatch.
  - id: drill-atomic-t1046-replay
    description: "Atomic T1046 replay on BOTSv1 host with synthetic alert_id — drill gate notes it, no case"
    alert:
      timestamp: "2026-09-10T19:30:11.745095Z"
      rule: {id: 991046, level: 7, groups: [suricata, ids, scan], description: "ET SCAN Behavioral Unusual Port Scan detected"}
      agent: {id: "001", name: we8105desk.waynecorpinc.local}
      data: {srcip: "192.168.250.100", dstip: "10.10.1.11", id: atomic-t1046-scan}
      _id: atomic-t1046-scan
    expect:
      verdict: note
      no_case: true
      no_dispatch: true
      category: operational

  - id: drill-atomic-t1053-replay
    description: "Atomic T1053 threat-desc replay (lvl 10, ET MALWARE desc) — drill gate holds even with threat tokens"
    alert:
      timestamp: "2026-09-10T12:00:14.188009Z"
      rule: {id: 991053, level: 10, groups: [persistence, process_creation, sysmon], description: "ET MALWARE Scheduled Task Creation for Persistence"}
      agent: {id: "001", name: we8105desk.waynecorpinc.local}
      data: {id: atomic-t1053-task}
      _id: atomic-t1053-task
    expect:
      verdict: note
      no_case: true
      no_dispatch: true
      category: threat

  - id: drill-tech-synthetic-on-real-host
    description: "tech- synthetic alert_id on a REAL host (Raspberry Robin shape) — prefix alone triggers the gate"
    alert:
      timestamp: "2026-09-08T18:09:33.000Z"
      rule: {id: 2045417, level: 12, groups: [suricata, malware, dns], description: "ET MALWARE Raspberry Robin"}
      agent: {id: "003", name: vault-secrets.waynecorpinc.local}
      data: {srcip: "10.6.6.66", dstip: "8.8.8.8"}
      _id: tech-1ee0dbb4
    expect:
      verdict: note
      no_case: true
      no_dispatch: true

  - id: drill-gate-does-not-swallows-live
    description: "REAL alert_id on the drill host with a real dst IP — gate must NOT suppress (live finding on shared host)"
    alert:
      timestamp: "2026-09-10T20:00:00.000Z"
      rule: {id: 5710, level: 5, groups: [authentication_failed, sshd], description: "sshd: authentication failed"}
      agent: {id: "001", name: we8105desk.waynecorpinc.local}
      data: {srcip: "203.0.113.66", dstip: "192.168.1.20"}
      _id: 8f3a2b1c-real-doc-991046-never
    expect:
      verdict: note
      category: authentication
      drill: false
      # Router contract: dispatch to analyst IS correct for an untuned
      # auth-failed (the analyst notes it — analyst/hunt drivers PASS note).
      router_role: analyst
      # note (medium auth-failed heuristic) — but must NOT be drill-suppressed
      # (real alert_id + real entities); the drill invariant asserts this.
