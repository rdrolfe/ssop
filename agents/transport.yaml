# SSOP transport configuration — which SIEM backend the agents query.
# The decision spine (alerts -> categories -> roles -> verdicts -> cases)
# is transport-agnostic; this file selects the backend + field ontology.
#
# backend: wazuh | securityonion | elastic | bots
#   - wazuh: OpenSearch indices (wazuh-alerts-*, wazuh-states-*) — the DEFAULT
#     for a clean checkout: the local Wazuh stack started by
#     deploy/docker-compose.yml, indexer at https://localhost:9200
#     (override with WAZUH_INDEXER_URL in .env)
#   - securityonion: Elasticsearch indices (so-*, .internal.alerts-*)
#   - elastic: generic Elasticsearch (future)
#   - bots: Splunk BOTSv1 dataset slices (see DEPLOYMENT.md Step 11)
#
# ENDPOINT PRECEDENCE: the indexer endpoint comes from .env first
# (WAZUH_INDEXER_URL, default host localhost:9200). No endpoint is hardcoded
# in this file — an explicit `endpoint:` here is an operator override and
# beats .env, so leave it blank unless you mean it.
backend: wazuh

# Global field ontology — the SAME semantic fields across backends.
# Per-backend overrides live in backends.<name>.fields (see below); the
# global values are the fallback when a backend doesn't override.
fields:
  timestamp: "@timestamp"        # Wazuh/OSD + Elastic share this
  level: "rule.level"
  groups: "rule.groups"
  category: "category"           # our enriched field (set by OTel pipeline)

# Per-backend settings (indexes + field-name overrides + endpoint + creds)
backends:
  wazuh:
    alerts_index: "wazuh-alerts-4.x-*"
    inventory_index: "wazuh-states-inventory-packages-*"
    # No hardcoded endpoint — WAZUH_INDEXER_URL in .env decides (local
    # compose default: https://localhost:9200). Homelab example:
    # endpoint: "https://192.168.1.75:9200"
    endpoint: ""
    # creds come from the .env (WAZUH_INDEXER_USER/PASSWORD) by default
  securityonion:
    alerts_index: ".ds-logs-suricata.alerts-so-*,.ds-logs-detections.alerts-so-*"
    inventory_index: "so-*"     # SO host data (Elastic Agent)
    # Homelab example (SO VM 706 — ES is HTTPS-only): set in .env or here.
    # SO_INDEXER_PASSWORD stays in .env either way.
    # endpoint: "https://192.168.1.76:9200"
    endpoint: ""
    # SO signals nest rule fields under signal.* — override the field names
    # for the ECS alert shape (suricata.alerts-so / detections.alerts-so).
    fields:
      level: "event.severity"
      groups: "tags"
    # SO ES creds: the user is fine to commit (it's a username); the password
    # lives in .env as SO_INDEXER_PASSWORD — never in this committed file.
    user: "<so-es-user>"
    # password: set via SO_INDEXER_PASSWORD in .env
  elastic:
    alerts_index: "logs-*"
    inventory_index: "logs-*"
    endpoint: ""
  bots:
    alerts_index: "bots-*-poc"   # BOTSv1 ingested slices (sysmon/http/winsys/suricata/dns)
    inventory_index: "bots-*-poc"
    # BOTS is an example homelab profile, never the default backend — opt in
    # by setting backend: bots AND the endpoint (env or here).
    # endpoint: "https://192.168.1.75:9200"
    endpoint: ""

# Rule map — the ontology: alert signature -> (category, role).
# The MEANING is ours; the signature ids are the SIEM's. Re-mapping for a
# new backend = editing this file, not code.
rules:
  510:    {category: security, role: analyst, template: rootcheck-drift, technique_id: "T1547.001"}      # rootcheck
  52002:  {category: pattern,  role: hunt, technique_id: "T1068"}        # apparmor
  5710:   {category: security, role: analyst}     # sshd auth failure
  5715:   {category: security, role: analyst}     # sshd auth success (unusual)
  86601:  {category: security, role: analyst}     # suricata generic
  5740:   {category: security, role: analyst}     # sshd
  40704:  {category: infra,   role: infra}        # systemd
  2901:   {category: security, role: analyst}     # dpkg config changed
  2902:   {category: security, role: analyst}     # dpkg config changed
  2903:   {category: security, role: analyst}     # dpkg config changed
  2904:   {category: security, role: analyst}     # dpkg config changed
  23502:  {category: security, role: analyst}     # vulnerability-detector

# Security Onion rule map — SO signals carry the rule under signal.rule; the
# signatures are the ET/emerging-threats IDs SO indexes. Categories map to the
# SAME ontology; only the signature-id key changes.
securityonion_rules:
  2024724: {category: threat,  role: analyst}      # ET ADWARE/PUP DNS
  2027418: {category: threat,  role: analyst}      # ET PUP LNKR
  2027863: {category: operational, role: analyst}  # ET INFO .biz TLD
  2045417: {category: threat,  role: analyst}      # ET MALWARE Raspberry Robin
  2045481: {category: threat,  role: analyst}      # ET MALWARE 0x9.biz
  2049500: {category: threat,  role: analyst}      # ET MALWARE BIOPASS RAT (approx)
  default: {category: operational, role: null}

# --- EGRESS REGISTRY (enforced by agents/verify/check_egress.py) -----------
# Every EXTERNAL (non-lab) network destination an agent module may contact
# MUST be declared here. The gate fails the matrix on any undeclared
# external endpoint found in agents/**.py. SOVEREIGNTY NOTE: the sovereignty
# claim covers AI INFERENCE (no cloud provider owns our decisions) — it does
# NOT forbid external data-plane calls; it requires them DECLARED.
#   class: lookup   — sends indicator values (hash/domain/url/ip), receives
#                     reputation. Value-only egress.
#   class: submit   — uploads artifacts (files/URLs). A DISCLOSURE event;
#                     each entry must be explicitly operator-approved.
external_calls:
  greynoise:
    endpoint: api.greynoise.io
    class: lookup
    data_sent: indicator-value (ip)
    used_by: [tools/enrichment.py]
  virustotal:
    endpoint: www.virustotal.com
    class: lookup            # submission (class: submit) is DISABLED by
    data_sent: indicator-value (hash/domain/url)  # default: VT_SUBMIT_ENABLED=0
    used_by: [tools/enrichment.py]
  otx:
    endpoint: otx.alienvault.com
    class: lookup
    data_sent: indicator-value (IPv4/hash/domain/url)
    used_by: [tools/enrichment.py]

# --- infrastructure egress (NOT runtime egress from this host) --------------
# The envelope above is egress the SSOP RUNTIME makes. This section is egress we
# OWN but that verify/check_egress.py cannot see: a self-hosted service syncing
# from third-party feeds runs its own workers on its own host. Declaring it in
# YAML alone would be documentation rather than control (ADR-007 call 2), so it
# is ALSO enforced where the traffic actually leaves — a default-deny allow-list
# on the MISP host itself (nft table `ssop_egress`, output AND forward hooks).
infrastructure_egress:
  misp:
    host: 192.168.1.80            # VM 707 — outside the router DHCP pool
    class: lookup                 # ADR-007's registry class for the feed platform
    direction: inbound-sync       # the platform PULLS feeds; it is a data sink
    data_sent: none               # no SSOP observable is ever contributed
    # The absence of a `submit` entry is the point, not an omission: contributing
    # our observables back is a DISCLOSURE event (sovereignty doctrine, ADR-007
    # call 3). tools/misp_client.py is read-only and verify/test_misp_client.py +
    # verify/test_bulk_intel.py fail the build if a write endpoint appears.
    enforced_by: [deploy/lab/misp_egress_allowlist.sh]
    allowlist: /etc/ssop-egress/allowed-hosts.txt   # on the MISP host
    # Adding a feed = adding its host here, re-applying, verifying, then
    # persisting the VERIFIED live table (`misp_egress_allowlist.sh --persist`).
    # Anything absent is silently dropped — read `journalctl -k | grep
    # ssop-egress-drop` to see what a change actually blocked.
    #
    # NOT here: the hunt -> MISP bulk match. That call is host-to-LAN
    # (192.168.1.80, RFC1918), so check_egress.py already treats it as local and
    # it needs no external_calls entry. See tools/bulk_intel.py.
    used_by: [tools/misp_client.py, tools/bulk_intel.py]
