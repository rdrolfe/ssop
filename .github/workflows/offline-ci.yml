name: offline-ci

# Offline gate: hermetic regression tests, no secrets, no network, no live
# services. Live/integration checks (verify matrix against runtime hosts)
# are reported separately and are NOT part of this gate.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hermetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # owlready2 boots an embedded HermiT reasoner inside a JVM — the
      # ontology gate (agents/verify/check_ontology.py) needs java on PATH.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Offline suite
        run: python agents/verify/run_offline_ci.py
